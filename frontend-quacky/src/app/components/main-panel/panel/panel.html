<div 
  class="fixed inset-0 w-screen h-screen flex flex-row bg-slate-950/20 text-slate-100 font-sans overflow-hidden transition-colors duration-300"
  [ngClass]="{'light-theme': isLightTheme()}"
>

  <!-- ================= SIDEBAR (LEFT) ================= -->
  <aside class="w-80 h-full flex flex-col bg-slate-900/60 border-r border-slate-800/80 backdrop-blur-xl z-10 shrink-0">
    <!-- User Profile (Top Left) -->
    <app-user-profile></app-user-profile>

    <!-- Chat Details Section (Below User Profile) -->
    <app-chat-details></app-chat-details>
  </aside>

  <!-- ================= MAIN PANEL (RIGHT) ================= -->
  <main class="flex-1 h-full flex flex-col overflow-hidden bg-slate-950/40 relative">
    <!-- Top Section: Horizontal Chat Icon List -->
    <app-chat-selector></app-chat-selector>

    <!-- Main Content Area: Message logs or Empty Splash Screen -->
    <div class="flex-1 flex flex-col overflow-hidden relative">
      @if (selectedChatId() !== null) {
        <app-chat-view></app-chat-view>
      } @else {
        <app-welcome-splash></app-welcome-splash>
      }
    </div>
  </main>
</div>

<!-- ================= SETTINGS DIALOG / MODAL ================= -->
<app-settings-modal></app-settings-modal>

<!-- ================= ADD NEW POND CHAT DIALOG / MODAL ================= -->
<app-add-chat-modal></app-add-chat-modal>
